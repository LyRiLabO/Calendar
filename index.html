<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手帳曆 · 共編行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-deep:#EFE8D6;
    --line:#DBD0B4;
    --line-soft:#E8E0CC;
    --ink:#20263A;
    --ink-soft:#5B6178;
    --ink-faint:#9096A8;
    --red:#B23A2F;
    --red-deep:#8E2C24;
    --card:#FFFDF8;
    --shadow:rgba(32,38,58,0.16);
    --gold:#C08A2E;
    --sage:#7C8F6A;
    --dusk:#6E7FA3;
    --blush:#C77B6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 整個介面預設不能被框選文字，這是像手機 App 一樣操作的關鍵：
     手指誤觸不會選到文字。雙擊/雙指縮放已經靠 viewport 的
     user-scalable=no 擋掉了，這裡刻意不再疊加 touch-action:manipulation——
     那樣會讓瀏覽器提早搶走垂直滑動的判斷權，害長按拖曳（移動行程、
     空白處拉框建立行程）的 400ms 判斷來不及生效，整個被當成頁面捲動。
     真正需要輸入文字的欄位（文字框、日期、時間、數字、多行備註）
     則保留正常的選取/游標行為，不然沒辦法編輯內容。 */
  html, body{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  input, textarea{
    -webkit-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:#DDD5C0;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100%;
  }
  #phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }
  @media (min-width:431px){
    body{padding:28px 0;}
    #phone{min-height:860px; border-radius:28px; box-shadow:0 30px 70px rgba(20,20,30,0.45);}
  }

  .page{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--paper);
    transform:translateX(0);
    transition:transform .32s cubic-bezier(.4,0,.2,1), opacity .32s ease;
  }
  .page.hidden{visibility:hidden; pointer-events:none;}
  #page-edit{transform:translateX(100%);}
  #page-edit.active{transform:translateX(0);}
  #page-timeline.pushed{transform:translateX(-18%); filter:brightness(0.9);}

  /* ---------- Timeline page ---------- */
  .planner-header{
    padding:22px 20px 14px 20px;
    display:flex; flex-direction:column; gap:10px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:relative;
    z-index:3;
  }
  .header-row-top{
    display:flex; align-items:center; gap:14px;
    min-width:0;
  }
  .header-row-bottom{
    display:flex; justify-content:flex-end;
  }
  .rings{display:flex; flex-direction:column; gap:5px; margin-right:2px;}
  .rings span{width:9px;height:9px;border-radius:50%;background:var(--paper-deep); border:1.5px solid var(--ink-faint);}
  .brandmark{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:20px;
    letter-spacing:.02em;
    color:var(--ink);
    flex:0 0 auto;
  }
  .brandmark small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:9.5px;
    letter-spacing:.14em;
    color:var(--red);
    margin-top:2px;
  }
  .date-nav{
    margin-left:auto;
    display:flex; align-items:center; gap:10px;
    min-width:0;
  }
  .date-nav button{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .date-nav button:active{background:var(--paper-deep);}
  .add-col-btn{
    margin-left:10px;
    padding:8px 12px;
    border-radius:16px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .add-col-btn svg{flex:0 0 auto;}
  .add-col-btn:active{opacity:.8;}
  .date-display{text-align:center; flex:0 1 108px; min-width:0;}
  .date-display .weekday{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.12em;
    color:var(--ink-faint);
  }
  .date-display .date-num{
    display:block;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .timeline-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    touch-action:pan-y;
    overscroll-behavior:contain;
  }
  .day-slider{
    position:relative;
    height:1200px; /* 24 * 50px，撐開外層可以捲動的高度 */
    overflow-x:hidden;
  }
  .timeline-grid, .day-preview-panel{
    position:absolute;
    top:0; left:0; right:16px;
    height:1200px;
  }
  .timeline-grid{
    touch-action:none;
  }
  .day-preview-panel{
    pointer-events:none; /* 純預覽用，滑動中不可互動 */
  }
  .day-slider.animating .timeline-grid,
  .day-slider.animating .day-preview-panel{
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .margin-rule{
    position:absolute;
    top:0; bottom:0;
    left:52px;
    width:1.5px;
    background:var(--red);
    opacity:.55;
    z-index:1;
  }
  .hour-row{
    position:absolute;
    left:0; right:0;
    height:50px;
    border-top:1px solid var(--line-soft);
  }
  .hour-row:first-child{border-top:none;}
  .hour-row .hlabel{
    position:absolute;
    left:12px; top:-7px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    background:var(--paper);
    padding:0 3px;
  }
  .hour-row .half-tick{
    position:absolute;
    left:52px; right:0; top:25px;
    border-top:1px dashed var(--line);
    opacity:.7;
  }
  .hour-row .quarter-tick{
    position:absolute;
    left:52px; right:0;
    border-top:1px dotted var(--line);
    opacity:.4;
  }
  .now-line{
    position:absolute;
    left:52px; right:0;
    height:0;
    border-top:2px solid var(--red);
    z-index:4;
  }
  .now-line::before{
    content:"";
    position:absolute;
    left:-4px; top:-4px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--red);
  }
  .events-layer{
    position:absolute; inset:0;
    left:58px; right:14px;
    z-index:2;
  }
  .event-card{
    position:absolute;
    left:0; right:0;
    min-height:8px;
    touch-action:none;
    background:var(--card);
    border-radius:8px;
    border-left:4px solid var(--gold);
    box-shadow:0 2px 6px var(--shadow);
    padding:5px 10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  .event-card .ecard-title{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .event-card .ecard-time{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .event-card.c-gold{border-left-color:var(--gold);}
  .event-card.c-sage{border-left-color:var(--sage);}
  .event-card.c-dusk{border-left-color:var(--dusk);}
  .event-card.c-blush{border-left-color:var(--blush);}
  .event-card.dragging{
    transform:scale(1.04);
    box-shadow:0 10px 26px var(--shadow);
    z-index:10;
  }
  .event-card.resizing{
    box-shadow:0 10px 26px var(--shadow);
    z-index:12;
  }
  .resize-handle{
    position:absolute;
    right:-4px; bottom:-4px;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--paper);
    cursor:se-resize;
    touch-action:none;
    z-index:13;
    transition:transform .12s ease;
  }
  .resize-handle.active{
    transform:scale(1.7);
  }

  /* 長按拖曳行程時的浮動卡片：脫離欄位的百分比定位系統，直接用
     position:fixed 跟著手指座標走，可以自由跨欄、跨日移動，
     不會被卡在固定的欄位位置上。 */
  .card-ghost{
    position:fixed !important;
    right:auto !important;
    z-index:999;
    pointer-events:none;
    box-shadow:0 14px 30px rgba(32,38,58,0.38);
    transform:scale(1.06);
    opacity:0.97;
  }
  .card-ghost .resize-handle{ display:none; }

  /* 時長 < 45 分鐘：高度放不下兩行，標題與時間改成同一行並排 */
  .event-card.compact{
    display:flex;
    align-items:center;
    padding:2px 9px;
  }
  .event-card.compact .ecard-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    min-width:0;
    width:100%;
    overflow:hidden;
    white-space:nowrap;
  }
  .event-card.compact .ecard-row .ecard-title{
    flex:0 1 auto;
    min-width:0;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .event-card.compact .ecard-row .ecard-time{
    flex:0 0 auto;
    margin:0;
  }

  /* 時長 < 15 分鐘：連一行都放不下，改成單一文字節點，用 JS 動態縮小字體塞進區塊 */
  .event-card.tiny{
    padding:1px 8px;
    display:flex;
    align-items:center;
  }
  .event-card.tiny .ecard-solo{
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    color:var(--ink);
    line-height:1.15;
  }

  .fab{
    position:absolute;
    right:16px; bottom:22px;
    width:auto; height:auto;
    padding:10px;
    border-radius:12px;
    background:none;
    color:var(--ink);
    border:none;
    box-shadow:none;
    filter:drop-shadow(0 3px 6px rgba(32,38,58,0.28));
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
  }
  .fab:active{opacity:.6;}

  .selection-box{
    position:absolute;
    left:58px; right:14px;
    background:rgba(178,58,47,0.12);
    border:1.5px dashed var(--red);
    border-radius:6px;
    z-index:6;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .selection-box .selection-label{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:11px;
    color:var(--red-deep);
    background:var(--paper);
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
  }

  .column-header-row{
    position:sticky; top:0; z-index:3;
    display:flex;
    padding:10px 14px 8px 58px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    gap:0;
  }
  .column-header-row .col-head{
    flex:1 1 0;
    min-width:0;
    text-align:center;
    padding:0 4px;
  }
  .col-head .col-dot{
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    margin-right:4px;
  }
  .col-head .col-name{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .col-head.col-gold .col-dot{background:var(--gold);}
  .col-head.col-sage .col-dot{background:var(--sage);}
  .col-head.col-dusk .col-dot{background:var(--dusk);}
  .col-head.col-blush .col-dot{background:var(--blush);}

  .col-dividers{
    position:absolute;
    inset:0;
    left:58px; right:14px;
    z-index:1;
    pointer-events:none;
  }
  .col-dividers .col-div-line{
    position:absolute;
    top:0; bottom:0;
    width:1px;
    background:var(--line);
    opacity:.8;
  }

  .hint-empty{
    position:absolute;
    left:58px; right:14px; top:14px;
    font-size:11px; color:var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    pointer-events:none;
  }

  /* ---------- Edit page ---------- */
  .edit-header{
    padding:20px 16px 16px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .edit-title-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.18em;
    color:var(--ink-faint);
  }
  .text-btn{
    background:none; border:none;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
    color:var(--ink-soft);
    padding:6px 4px;
    cursor:pointer;
  }
  .text-btn.primary{
    color:#fff;
    background:var(--red);
    border-radius:20px;
    padding:7px 18px;
    font-weight:700;
  }
  .text-btn.primary:active{background:var(--red-deep);}
  .text-btn:active{color:var(--ink);}

  .edit-body{
    flex:1;
    overflow-y:auto;
    padding:22px 20px 40px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .field input[type=text],
  .field input[type=date],
  .field textarea{
    font-family:'Noto Serif TC', serif;
    font-size:17px;
    color:var(--ink);
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    padding:6px 2px 10px 2px;
    outline:none;
    width:100%;
  }
  .field input:focus-visible,
  .field textarea:focus-visible,
  .time-trio input:focus-visible{
    outline:none;
    border-bottom-color:var(--red);
  }
  .field textarea{
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
    line-height:1.7;
    resize:vertical;
    border:1px dashed var(--line);
    border-radius:8px;
    padding:12px;
    background:var(--card);
  }

  .ticket{
    display:flex;
    background:var(--card);
    border-radius:12px;
    box-shadow:0 2px 8px var(--shadow);
    position:relative;
    overflow:visible;
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    background:var(--paper);
    border-radius:50%;
  }
  .ticket::before{left:-8px;}
  .ticket::after{right:-8px;}
  .time-trio{
    display:flex;
    width:100%;
    padding:14px 16px;
  }
  .time-trio .tcell{
    flex:1;
    display:flex; flex-direction:column; gap:6px;
    position:relative;
  }
  .time-trio .tcell + .tcell{
    margin-left:12px;
    padding-left:12px;
    border-left:1px dashed var(--line);
  }
  .time-trio label{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:.08em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .time-trio input{
    border:none;
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    padding:2px 0;
    width:100%;
  }
  .time-trio input[type=number]{
    -moz-appearance:textfield;
  }

  .delete-btn{
    margin-top:6px;
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1.5px solid var(--red);
    background:transparent;
    color:var(--red);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .delete-btn:active{background:var(--red); color:#fff;}

  .participants-box{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .participant-chip{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:18px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .participant-chip .chip-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--ink-faint);
  }
  .participant-chip.selected{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper);
  }
  .participant-chip.selected .chip-dot{background:var(--paper);}

  .weekday-box{
    display:flex; gap:8px;
  }
  .weekday-chip{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .weekday-chip.selected{
    border-color:var(--red);
    background:var(--red);
    color:#fff;
  }

  .sync-toggle{
    display:flex; align-items:center; gap:10px;
    padding:13px 14px;
    border-radius:10px;
    border:1px dashed var(--line);
    background:var(--card);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .sync-toggle input{
    width:18px; height:18px;
    accent-color: var(--red);
  }

  .field input[type=date]:disabled{
    color: var(--ink-faint);
    -webkit-text-fill-color: var(--ink-faint);
    opacity: 1;
  }

  .ecard-recur-tag{
    float:right;
    font-size:22px;
    line-height:0.7;
    color:var(--ink-soft);
    margin-left:4px;
  }
  .ecard-recur-inline{
    font-size:1.7em;
    line-height:0;
    vertical-align:-3px;
    color:var(--ink-soft);
    margin-right:2px;
    display:inline-block;
  }

  ::-webkit-scrollbar{width:0;height:0;}

  @media (prefers-reduced-motion: reduce){
    .page{transition:none;}
    .event-card{transition:none;}
  }
</style>
</head>
<body>
<div id="phone">

  <!-- ============ 頁面一：時間軸主頁 ============ -->
  <section id="page-timeline" class="page active">
    <header class="planner-header">
      <div class="header-row-top">
        <div class="rings"><span></span><span></span><span></span></div>
        <div class="brandmark">手帳曆<small>SHARED PLANNER</small></div>
        <div class="date-nav">
          <button id="prevDay" aria-label="前一天">‹</button>
          <div class="date-display">
            <span class="weekday" id="weekdayLabel">—</span>
            <span class="date-num" id="dateLabel">—</span>
          </div>
          <button id="nextDay" aria-label="後一天">›</button>
        </div>
      </div>
      <div class="header-row-bottom">
        <button id="btnAddColumn" class="add-col-btn" aria-label="新增使用者欄位">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g transform="scale(-1,1) translate(-24,0)">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </g>
          </svg>
          <span>新增</span>
        </button>
      </div>
    </header>

    <div class="timeline-scroll" id="timelineScroll">
      <div class="column-header-row" id="columnHeaderRow"></div>
      <div class="day-slider" id="daySlider">
        <div class="timeline-grid" id="timelineGrid">
          <div class="margin-rule"></div>
          <!-- hour-row 由 JS 產生 -->
          <div class="col-dividers" id="colDividers"></div>
          <div class="events-layer" id="eventsLayer"></div>
        </div>
      </div>
    </div>

    <button class="fab" id="fabAdd" aria-label="新增行程">
      <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true">
        <g transform="rotate(45 50 50)" fill="currentColor">
          <!-- 橡皮擦 -->
          <rect x="40" y="8" width="20" height="14" rx="4"/>
          <!-- 金屬箍(上下用留白間隙跟橡皮擦、筆身分開) -->
          <rect x="40" y="25" width="20" height="6"/>
          <!-- 筆身 -->
          <rect x="40" y="34" width="20" height="40"/>
          <!-- 筆尖(用留白間隙跟筆身分開) -->
          <path d="M40 77 L60 77 L50 95 Z"/>
        </g>
      </svg>
    </button>
  </section>

  <!-- ============ 頁面二：行程編輯頁 ============ -->
  <section id="page-edit" class="page">
    <header class="edit-header">
      <button id="btnCancel" class="text-btn">取消</button>
      <span class="edit-title-label">行程卡</span>
      <button id="btnDone" class="text-btn primary">完成</button>
    </header>

    <div class="edit-body">
      <div class="field">
        <span class="field-label">行程名稱</span>
        <input id="fieldTitle" type="text">
      </div>

      <div class="field">
        <span class="field-label">日期</span>
        <input id="fieldDate" type="date">
      </div>

      <div class="field">
        <span class="field-label">時間設定</span>
        <div class="ticket">
          <div class="time-trio">
            <div class="tcell">
              <label for="fieldStart">開始時間</label>
              <input id="fieldStart" type="time" step="900">
            </div>
            <div class="tcell">
              <label for="fieldEnd">結束時間</label>
              <input id="fieldEnd" type="time" step="900">
            </div>
            <div class="tcell">
              <label for="fieldDuration">所需分鐘</label>
              <input id="fieldDuration" type="number" min="15" step="15" inputmode="numeric">
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="field-label">重複</span>
        <div class="weekday-box" id="weekdayBox"></div>
      </div>

      <div class="field" id="syncField" style="display:none;">
        <label class="sync-toggle">
          <input type="checkbox" id="fieldSyncEdit">
          <span>同步編輯整個重複系列</span>
        </label>
      </div>

      <div class="field">
        <span class="field-label">參與者</span>
        <div class="participants-box" id="participantsBox"></div>
      </div>

      <div class="field">
        <span class="field-label">詳細備註</span>
        <textarea id="fieldNotes" rows="5"></textarea>
      </div>

      <button id="btnDelete" class="delete-btn">刪除此行程</button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ---------------- 資料狀態 ---------------- */
  const pad2 = n => String(n).padStart(2,'0');
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  };
  const T0 = todayStr();
  const dateByOffset = (dateStr, delta) => {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d+delta);
    return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
  };

  // 每個 column 代表一位共編者自己的直向欄位
  let columns = [
    {id:'p1', name:'我'}
  ];

  let events = [
    {id:'e1', title:'晨間會議', date:T0, start:'09:00', end:'10:30', notes:'記得帶筆電與投影線材。', participants:['p1']},
    {id:'e2', title:'研究冰淇淋機', date:T0, start:'14:00', end:'15:00', notes:'客廳桌上製作，不准上床。', participants:['p1']},
    {id:'e3', title:'健身房', date:T0, start:'19:00', end:'20:00', notes:'', participants:['p1']}
  ];

  /* ---------------- 本機儲存（重新整理、關掉分頁再打開，資料還在） ----------------
     用瀏覽器的 localStorage，只存在「這一台裝置的這個瀏覽器」裡，不會跨裝置
     同步（跨裝置即時共編需要接後端資料庫，是下一步要做的事）。
     這裡刻意包一層 try/catch：像 Claude 對話裡內建的預覽視窗這種沙盒環境，
     可能會擋掉 localStorage 的存取；擋掉的話就安靜地退回純記憶體模式（跟
     之前的行為一樣），不會讓其他功能跟著壞掉。實際部署到 Netlify／自己網域
     之後，就是一般瀏覽器環境，會正常運作。 */
  const STORAGE_KEY = 'shared-planner-v1';
  let storageAvailable = true;

  function saveToStorage(){
    if(!storageAvailable) return;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({columns, events}));
    }catch(err){
      storageAvailable = false;
    }
  }

  function loadFromStorage(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.columns) && data.columns.length && Array.isArray(data.events)){
        return data;
      }
    }catch(err){
      storageAvailable = false;
    }
    return null;
  }

  const savedData = loadFromStorage();
  if(savedData){
    columns = savedData.columns;
    events = savedData.events;
  }

  let currentDate = T0;      // 目前檢視的日期 (YYYY-MM-DD)

  const timeToMinutes = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
  const minutesToTime = min => {
    min = Math.max(0, Math.min(23*60+55, min));
    const h = Math.floor(min/60), m = min%60;
    return pad2(h)+':'+pad2(m);
  };
  const colorClass = id => {
    const arr=['c-gold','c-sage','c-dusk','c-blush'];
    let h=0; for(const ch of String(id)) h = (h*31 + ch.charCodeAt(0))>>>0;
    return arr[h % arr.length];
  };
  const PALETTE = ['gold','sage','dusk','blush'];
  const colByIndex = idx => PALETTE[((idx%PALETTE.length)+PALETTE.length)%PALETTE.length];

  function colIndex(colId){
    return columns.findIndex(c => c.id === colId);
  }
  // 一個行程可能橫跨多欄，但參與者不一定相鄰（例如選了第1、3位，
  // 沒選第2位）。這種情況要拆成多個連續區段分別顯示，中間空著，
  // 而不是把整個範圍都畫滿。
  function eventColRuns(ev){
    const idxs = Array.from(new Set((ev.participants||[]).map(colIndex).filter(i => i>=0))).sort((a,b)=>a-b);
    if(idxs.length===0) return [[0,0]];
    const runs = [];
    let start = idxs[0], prev = idxs[0];
    for(let i=1; i<idxs.length; i++){
      if(idxs[i] === prev+1){
        prev = idxs[i];
      } else {
        runs.push([start, prev]);
        start = idxs[i]; prev = idxs[i];
      }
    }
    runs.push([start, prev]);
    return runs;
  }

  const WEEKDAYS = ['週日','週一','週二','週三','週四','週五','週六'];

  function weekdayOf(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d).getDay();
  }

  // 把「行程資料」展開成某一天實際要顯示的「實例」清單。
  // 一般行程：date 完全相符才顯示。
  // 重複行程（有 ev.recurrence）：只要 dateStr 的星期幾在
  // recurrence.weekdays 裡、且 dateStr >= 起始日期、且沒有被排除，
  // 就會展開出一個實例；若這個日期有獨立編輯過的 overrides，
  // 就用 overrides 蓋掉原本的欄位（同步編輯模式關閉時的效果）。
  function getInstancesForDate(dateStr){
    const list = [];
    events.forEach(ev => {
      if(ev.recurrence){
        const excluded = ev.excluded || [];
        if(dateStr >= ev.date &&
           ev.recurrence.weekdays.includes(weekdayOf(dateStr)) &&
           excluded.indexOf(dateStr) === -1){
          const ov = (ev.overrides && ev.overrides[dateStr]) || {};
          list.push({
            masterId: ev.id,
            instanceDate: dateStr,
            title: ov.title !== undefined ? ov.title : ev.title,
            start: ov.start !== undefined ? ov.start : ev.start,
            end: ov.end !== undefined ? ov.end : ev.end,
            notes: ov.notes !== undefined ? ov.notes : ev.notes,
            participants: ov.participants !== undefined ? ov.participants : ev.participants,
            isRecurring: true,
            hasOverride: !!(ev.overrides && ev.overrides[dateStr])
          });
        }
      } else if(ev.date === dateStr){
        list.push({
          masterId: ev.id,
          instanceDate: dateStr,
          title: ev.title, start: ev.start, end: ev.end,
          notes: ev.notes, participants: ev.participants,
          isRecurring: false, hasOverride: false
        });
      }
    });
    return list;
  }

  // 拖曳調整時間（快速手勢，沒有經過編輯頁的同步開關）一律視為「只改這一天」：
  // 一般行程直接改本體；重複行程則寫入這一天的 override，不影響系列其他日期。
  function quickSetTime(masterId, dateStr, newStart, newEnd){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    if(!master.recurrence){
      master.start = newStart;
      master.end = newEnd;
    } else {
      master.overrides = master.overrides || {};
      master.overrides[dateStr] = Object.assign({}, master.overrides[dateStr]||{}, {start:newStart, end:newEnd});
    }
  }

  // 拖曳卡片右下角圓點縮放區塊：同時可能改變時長（下緣）與參與者範圍
  // （右緣，起始欄不動）。一樣視為「只改這一天」：一般行程直接改本體；
  // 重複行程則寫入這一天的 override，不影響系列其他日期。
  function quickSetTimeAndParticipants(masterId, dateStr, newStart, newEnd, newParticipants){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    if(!master.recurrence){
      master.start = newStart;
      master.end = newEnd;
      master.participants = newParticipants;
    } else {
      master.overrides = master.overrides || {};
      master.overrides[dateStr] = Object.assign({}, master.overrides[dateStr]||{}, {
        start:newStart, end:newEnd, participants:newParticipants
      });
    }
  }

  // 把某一天的行程搬到另一個日期（拖曳行程到畫面邊緣切日時使用）。
  // 非重複行程：直接改日期。重複行程：把「這一天」從系列中排除，
  // 另外在新日期建立一個獨立的（不重複）行程，系列其餘日期不受影響。
  function moveInstanceToDate(masterId, instanceDate, targetDate){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    if(!master.recurrence){
      master.date = targetDate;
      return;
    }
    const ov = (master.overrides && master.overrides[instanceDate]) || {};
    events.push({
      id: 'e' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
      title: ov.title !== undefined ? ov.title : master.title,
      date: targetDate,
      start: ov.start !== undefined ? ov.start : master.start,
      end: ov.end !== undefined ? ov.end : master.end,
      notes: ov.notes !== undefined ? ov.notes : master.notes,
      participants: (ov.participants !== undefined ? ov.participants : master.participants).slice()
    });
    master.excluded = master.excluded || [];
    if(master.excluded.indexOf(instanceDate) === -1) master.excluded.push(instanceDate);
    if(master.overrides) delete master.overrides[instanceDate];
  }

  /* ---------------- 時間軸主頁 ---------------- */
  const timelineGrid = document.getElementById('timelineGrid');
  const eventsLayer = document.getElementById('eventsLayer');
  const colDividers = document.getElementById('colDividers');
  const columnHeaderRow = document.getElementById('columnHeaderRow');
  const weekdayLabel = document.getElementById('weekdayLabel');
  const dateLabel = document.getElementById('dateLabel');

  function renderColumnHeader(){
    columnHeaderRow.innerHTML = '';
    columns.forEach((col, idx) => {
      const cell = document.createElement('div');
      cell.className = 'col-head col-' + colByIndex(idx);
      cell.innerHTML = '<span class="col-dot"></span><span class="col-name"></span>';
      cell.querySelector('.col-name').textContent = col.name;
      columnHeaderRow.appendChild(cell);
    });
  }

  function renderColumnDividers(){
    colDividers.innerHTML = '';
    for(let i=1; i<columns.length; i++){
      const line = document.createElement('div');
      line.className = 'col-div-line';
      line.style.left = (i/columns.length*100)+'%';
      colDividers.appendChild(line);
    }
  }

  function buildHourRows(){
    // 先移除舊的 hour-row（保留 margin-rule 與 events-layer）
    timelineGrid.querySelectorAll('.hour-row').forEach(el=>el.remove());
    for(let h=0; h<24; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      row.style.top = (h*50)+'px';
      row.innerHTML = '<span class="hlabel">'+pad2(h)+':00</span><span class="half-tick"></span>'+
        '<span class="quarter-tick" style="top:12.5px"></span><span class="quarter-tick" style="top:37.5px"></span>';
      timelineGrid.insertBefore(row, eventsLayer);
    }
  }

  function renderDateHeader(){
    const [y,m,d] = currentDate.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    weekdayLabel.textContent = (y)+'年';
    dateLabel.textContent = m+'月'+d+'日 · '+WEEKDAYS[dt.getDay()];
  }

  function renderNowLine(){
    const old = timelineGrid.querySelector('.now-line');
    if(old) old.remove();
    if(currentDate !== todayStr()) return;
    const now = new Date();
    const min = now.getHours()*60 + now.getMinutes();
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.top = (min/60*50)+'px';
    timelineGrid.insertBefore(line, eventsLayer);
  }

  function renderEvents(){
    saveToStorage(); // 每次重繪代表資料可能剛異動過，順便存起來
    eventsLayer.innerHTML = '';
    renderColumnDividers();
    const insts = getInstancesForDate(currentDate);
    if(insts.length === 0){
      const hint = document.createElement('div');
      hint.className = 'hint-empty';
      hint.textContent = '此日尚無行程 · 長按空白格拖曳選取，或按右上角「＋新增」';
      eventsLayer.appendChild(hint);
      return;
    }
    insts.forEach(inst => {
      if(floatingDrag && floatingDrag.masterId === inst.masterId && floatingDrag.homeDate === inst.instanceDate){
        return; // 這個行程正在被浮動拖曳中，本尊先不畫，只顯示浮動的 ghost
      }
      const startMin = timeToMinutes(inst.start);
      const endMin = timeToMinutes(inst.end);
      const top = startMin/60*50;
      const height = Math.max(8, (endMin-startMin)/60*50);
      const n = columns.length;
      const runs = eventColRuns(inst);
      const firstIdx = runs[0][0]; // 顏色統一用第一位參與者，同一行程的每個分段顏色一致
      const names = (inst.participants||[])
        .map(pid => { const c = columns.find(x=>x.id===pid); return c ? c.name : null; })
        .filter(Boolean).join('、');

      runs.forEach(([runMin, runMax]) => {
        const leftPct = (runMin/n*100);
        const widthPct = ((runMax-runMin+1)/n*100);

        const card = document.createElement('div');
        card.className = 'event-card ' + 'c-' + colByIndex(firstIdx);
        card.style.top = top+'px';
        card.style.height = height+'px';
        card.style.left = 'calc(' + leftPct + '% + 3px)';
        card.style.width = 'calc(' + widthPct + '% - 6px)';
        card.dataset.masterId = inst.masterId;
        card.dataset.date = inst.instanceDate;

        const durationMin = endMin - startMin;
        const recurMark = inst.isRecurring ? '<span class="ecard-recur-inline">↻</span>' : '';
        const title = escapeHtml(inst.title || '(未命名行程)');
        const timeStr = inst.start+' - '+inst.end;

        if(durationMin < 15){
          // 連一行都放不下：整段文字用同一個節點，稍後統一縮字塞進去
          card.classList.add('tiny');
          card.innerHTML =
            '<span class="ecard-solo">'+recurMark+title+' · '+timeStr+'</span>';
        } else if(durationMin < 45){
          // 放得下一行，但兩行會被壓縮：標題與時間並排在同一行
          card.classList.add('compact');
          card.innerHTML =
            '<div class="ecard-row">'+
              '<span class="ecard-title">'+recurMark+title+'</span>'+
              '<span class="ecard-time">'+timeStr+'</span>'+
            '</div>';
        } else {
          card.innerHTML =
            (inst.isRecurring ? '<span class="ecard-recur-tag">↻</span>' : '') +
            '<div class="ecard-title">'+title+'</div>'+
            '<div class="ecard-time">'+timeStr+(names ? ' · '+escapeHtml(names) : '')+'</div>';
        }

        attachCardInteractions(card, inst, runMin, runMax);
        const handle = document.createElement('span');
        handle.className = 'resize-handle';
        handle.setAttribute('aria-hidden', 'true');
        card.appendChild(handle);
        attachResizeHandle(card, inst, handle, runMin, runMax);
        eventsLayer.appendChild(card);
        if(durationMin < 15) fitTinyCardText(card);
      });
    });
  }

  // 區塊小到連一行都放不下時，逐步縮小字體直到內容剛好能塞進區塊高度為止
  // （下限 6px，避免縮到看不清楚）。
  function fitTinyCardText(card){
    const solo = card.querySelector('.ecard-solo');
    if(!solo) return;
    let fontSize = 11;
    solo.style.fontSize = fontSize+'px';
    let guard = 0;
    while(card.scrollHeight > card.clientHeight && fontSize > 6 && guard < 20){
      fontSize -= 0.5;
      solo.style.fontSize = fontSize+'px';
      guard++;
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTimeline(){
    renderDateHeader();
    renderColumnHeader();
    renderNowLine();
    renderEvents();
  }

  /* ---------------- 跨日滑動轉場（左右滑動切日 / 拖曳行程到畫面邊緣切日 共用） ----------------
     核心概念：畫面上同時放著「目前這天」跟「即將滑入的那一天（唯讀預覽，
     不能互動）」兩塊面板，手勢移動多少，兩塊面板就一起平移多少，感覺
     跟垂直捲動一樣連貫；放開後如果滑動幅度夠大就用動畫把畫面接續著滑
     完最後一小段，此時才真的切換 currentDate 並重新整理成完整可互動的
     內容；幅度不夠就用動畫彈回原位，不改變日期。 */
  const daySlider = document.getElementById('daySlider');
  let previewPanel = null;
  let previewDirection = null; // 'next' 表示手勢往左滑、預覽面板是明天；'prev' 則是昨天

  // 產生某一天的「唯讀預覽」面板：只畫時間格線、欄位分隔線、行程卡片外觀，
  // 不綁任何長按/拖曳互動，純粹給滑動轉場當中的視覺過場使用。
  function buildStaticDayPanel(dateStr){
    const panel = document.createElement('div');
    panel.className = 'timeline-grid day-preview-panel';

    for(let h=0; h<24; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      row.style.top = (h*50)+'px';
      row.innerHTML = '<span class="hlabel">'+pad2(h)+':00</span><span class="half-tick"></span>';
      panel.appendChild(row);
    }

    const n = Math.max(1, columns.length);
    const dividers = document.createElement('div');
    dividers.className = 'col-dividers';
    for(let i=1; i<n; i++){
      const line = document.createElement('div');
      line.className = 'col-div-line';
      line.style.left = (i/n*100)+'%';
      dividers.appendChild(line);
    }
    panel.appendChild(dividers);

    const layer = document.createElement('div');
    layer.className = 'events-layer';
    getInstancesForDate(dateStr).forEach(inst => {
      const startMin = timeToMinutes(inst.start);
      const endMin = timeToMinutes(inst.end);
      const top = startMin/60*50;
      const height = Math.max(8, (endMin-startMin)/60*50);
      const durationMin = endMin-startMin;
      const runs = eventColRuns(inst);
      const firstIdx = runs[0][0];
      const names = (inst.participants||[])
        .map(pid => { const c = columns.find(x=>x.id===pid); return c ? c.name : null; })
        .filter(Boolean).join('、');
      const title = escapeHtml(inst.title||'(未命名行程)');
      const timeStr = inst.start+' - '+inst.end;

      runs.forEach(([runMin, runMax]) => {
        const card = document.createElement('div');
        card.className = 'event-card c-'+colByIndex(firstIdx);
        card.style.top = top+'px';
        card.style.height = height+'px';
        card.style.left = 'calc(' + (runMin/n*100) + '% + 3px)';
        card.style.width = 'calc(' + ((runMax-runMin+1)/n*100) + '% - 6px)';
        if(durationMin < 15){
          card.classList.add('tiny');
          card.innerHTML = '<span class="ecard-solo">'+title+' · '+timeStr+'</span>';
        } else if(durationMin < 45){
          card.classList.add('compact');
          card.innerHTML = '<div class="ecard-row"><span class="ecard-title">'+title+'</span><span class="ecard-time">'+timeStr+'</span></div>';
        } else {
          card.innerHTML = '<div class="ecard-title">'+title+'</div><div class="ecard-time">'+timeStr+(names ? ' · '+escapeHtml(names) : '')+'</div>';
        }
        layer.appendChild(card);
        if(durationMin < 15) fitTinyCardText(card);
      });
    });
    panel.appendChild(layer);
    return panel;
  }

  function ensurePreviewPanel(direction){
    if(previewPanel && previewDirection === direction) return previewPanel;
    if(previewPanel){ previewPanel.remove(); previewPanel = null; }
    previewDirection = direction;
    const targetDate = dateByOffset(currentDate, direction === 'next' ? 1 : -1);
    const panel = buildStaticDayPanel(targetDate);
    panel.style.transform = 'translateX(' + (direction === 'next' ? '100%' : '-100%') + ')';
    daySlider.appendChild(panel);
    previewPanel = panel;
    return panel;
  }

  // 手勢進行中：即時跟著手指位移量(dx，往左滑為負值)平移兩塊面板
  function updateDaySlide(dx){
    const w = daySlider.clientWidth || 1;
    const direction = dx < 0 ? 'next' : 'prev';
    ensurePreviewPanel(direction);
    const clamped = Math.max(-w, Math.min(w, dx));
    timelineGrid.style.transform = 'translateX(' + clamped + 'px)';
    const base = direction === 'next' ? w : -w;
    previewPanel.style.transform = 'translateX(' + (base + clamped) + 'px)';
  }

  // 放開手指：滑動幅度夠大就用動畫接續滑完、真的切換日期；不夠就彈回原位
  function endDaySlide(dx){
    const w = daySlider.clientWidth || 1;
    const threshold = w * 0.28;
    const commit = Math.abs(dx) > threshold && previewPanel;
    daySlider.classList.add('animating');

    if(commit){
      const delta = dx < 0 ? 1 : -1;
      timelineGrid.style.transform = 'translateX(' + (dx < 0 ? -w : w) + 'px)';
      previewPanel.style.transform = 'translateX(0px)';
      setTimeout(function(){
        daySlider.classList.remove('animating');
        currentDate = dateByOffset(currentDate, delta);
        if(previewPanel){ previewPanel.remove(); previewPanel = null; }
        timelineGrid.style.transform = '';
        renderTimeline();
      }, 300);
    } else {
      timelineGrid.style.transform = 'translateX(0px)';
      if(previewPanel){
        const base = previewDirection === 'next' ? w : -w;
        previewPanel.style.transform = 'translateX(' + base + 'px)';
      }
      setTimeout(function(){
        daySlider.classList.remove('animating');
        if(previewPanel){ previewPanel.remove(); previewPanel = null; }
        timelineGrid.style.transform = '';
      }, 300);
    }
  }

  // 立即觸發完成一次日期切換的滑動動畫（給「拖曳行程到畫面邊緣」用，
  // 不是使用者手動滑出來的位移，是碰到邊緣就自動觸發一次完整轉場）。
  function animateCommitDaySlide(direction, onDone){
    const w = daySlider.clientWidth || 1;
    ensurePreviewPanel(direction);
    daySlider.classList.add('animating');
    requestAnimationFrame(function(){
      timelineGrid.style.transform = 'translateX(' + (direction === 'next' ? -w : w) + 'px)';
      previewPanel.style.transform = 'translateX(0px)';
    });
    setTimeout(function(){
      daySlider.classList.remove('animating');
      currentDate = dateByOffset(currentDate, direction === 'next' ? 1 : -1);
      if(previewPanel){ previewPanel.remove(); previewPanel = null; }
      timelineGrid.style.transform = '';
      renderTimeline();
      if(onDone) onDone();
    }, 300);
  }

  /* ---------------- 浮動拖曳（可連續跨欄、跨日移動） ----------------
     長按行程卡片後，卡片會變成一個跟著手指座標走的浮動分身（ghost），
     不再受欄位百分比定位的限制；拖到畫面邊緣停留著不放，會連續不斷地
     翻到下一天/上一天，直到手指離開邊緣或放開為止；放開的當下，才依
     ghost 最後停留的位置換算出最終的時間／欄位／日期並真正寫入資料。 */
  let floatingDrag = null; // {masterId, homeDate, ghost, w, h, span, durationMin, lastEdgeDir}
  let edgeFlipTimer = null;

  function positionGhost(clientX, clientY){
    if(!floatingDrag) return;
    floatingDrag.ghost.style.left = (clientX - floatingDrag.grabOffsetX) + 'px';
    floatingDrag.ghost.style.top = (clientY - floatingDrag.grabOffsetY) + 'px';
  }

  function flipDayInstant(direction){
    animateCommitDaySlide(direction, function(){});
  }

  function armEdgeFlip(direction){
    if(edgeFlipTimer) return;
    edgeFlipTimer = setTimeout(function(){
      edgeFlipTimer = null;
      flipDayInstant(direction);
      // 手指還停在邊緣的話，繼續連續翻下一天，不用放開再重來
      if(floatingDrag && floatingDrag.lastEdgeDir === direction){
        armEdgeFlip(direction);
      }
    }, 500);
  }
  function disarmEdgeFlip(){
    if(edgeFlipTimer){ clearTimeout(edgeFlipTimer); edgeFlipTimer = null; }
  }

  function startFloatingDrag(inst, runMin, runMax, sourceCard, clientX, clientY){
    const rect = sourceCard.getBoundingClientRect();
    const ghost = sourceCard.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.classList.remove('dragging', 'resizing');
    ghost.classList.add('card-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    document.body.appendChild(ghost);

    floatingDrag = {
      masterId: inst.masterId,
      homeDate: inst.instanceDate,
      ghost: ghost,
      w: rect.width,
      h: rect.height,
      // 手指抓住卡片時，指尖相對卡片左上角的位置——讓 ghost 全程保持
      // 手指原本抓的那個點，不要因為置中對齊而跳動；放開時也要用同一套
      // 偏移量換算回卡片左上角，才會跟畫面上看到的落點位置一致。
      grabOffsetX: clientX - rect.left,
      grabOffsetY: clientY - rect.top,
      span: runMax - runMin,
      durationMin: timeToMinutes(inst.end) - timeToMinutes(inst.start),
      lastEdgeDir: null
    };
    positionGhost(clientX, clientY);
    renderEvents(); // 立刻重繪一次：本尊卡片先隱藏，畫面上只剩浮動的 ghost
  }

  function updateFloatingDrag(clientX, clientY){
    if(!floatingDrag) return;
    positionGhost(clientX, clientY);

    const rect = eventsLayer.getBoundingClientRect();
    const nearLeft = clientX - rect.left < 34;
    const nearRight = rect.right - clientX < 34;
    if(nearLeft || nearRight){
      const dir = nearRight ? 'next' : 'prev';
      if(floatingDrag.lastEdgeDir !== dir){
        floatingDrag.lastEdgeDir = dir;
        disarmEdgeFlip();
        armEdgeFlip(dir);
      }
    } else if(floatingDrag.lastEdgeDir){
      floatingDrag.lastEdgeDir = null;
      disarmEdgeFlip();
    }
  }

  function endFloatingDrag(clientX, clientY){
    if(!floatingDrag) return;
    disarmEdgeFlip();
    const fd = floatingDrag;
    fd.ghost.remove();
    floatingDrag = null;

    // 換算成 ghost 實際的左上角位置（用抓取時記錄的偏移量還原），
    // 這樣落點才會跟畫面上看到的 ghost 位置完全一致，不會偏移。
    const ghostLeft = clientX - fd.grabOffsetX;
    const ghostTop = clientY - fd.grabOffsetY;

    const gridRect = timelineGrid.getBoundingClientRect();
    const rawMin = Math.round((ghostTop - gridRect.top)/50*60);
    const snappedStart = Math.max(0, Math.min(23*60, Math.round(rawMin/15)*15));
    const newStart = minutesToTime(snappedStart);
    const newEnd = minutesToTime(snappedStart + fd.durationMin);

    const evRect = eventsLayer.getBoundingClientRect();
    const n = Math.max(1, columns.length);
    const colWidthPx = evRect.width / n || 1;
    let colIdx = Math.floor((ghostLeft - evRect.left) / colWidthPx);
    colIdx = Math.max(0, Math.min(n - 1 - fd.span, colIdx));
    const newParticipants = columns.slice(colIdx, colIdx + fd.span + 1).map(c => c.id);

    quickSetTimeAndParticipants(fd.masterId, fd.homeDate, newStart, newEnd, newParticipants);
    if(fd.homeDate !== currentDate){
      moveInstanceToDate(fd.masterId, fd.homeDate, currentDate);
    }
    renderEvents();
  }

  /* ---------------- 長按拖拽（防誤觸） ---------------- */
  function attachCardInteractions(card, inst, runMin, runMax){
    let longPressTimer = null;
    let dragging = false;
    let cancelledByScroll = false;
    let startX = 0;
    let startY = 0;
    let lastY = 0;

    card.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      startX = e.clientX;
      startY = e.clientY;
      lastY = e.clientY;
      dragging = false;
      cancelledByScroll = false;

      longPressTimer = setTimeout(function(){
        if(cancelledByScroll) return;
        dragging = true;
        if(navigator.vibrate) navigator.vibrate(15);
        startFloatingDrag(inst, runMin, runMax, card, e.clientX, e.clientY);
      }, 400);

      const onMove = function(ev2){
        const dy = ev2.clientY - startY;
        if(!dragging){
          // 卡片本身是 touch-action:none，瀏覽器不會自動幫忙捲動頁面，
          // 所以一旦判定使用者其實是想捲動（而不是要長按拖曳），要自己
          // 動手把 scrollTop 往回推，才會有正常的捲動手感；未達門檻前
          // （手指還沒移動超過 16px）完全不動，讓長按判斷保有優先權。
          if(!cancelledByScroll && Math.abs(dy) > 16){
            cancelledByScroll = true;
            clearTimeout(longPressTimer);
          }
          if(cancelledByScroll){
            timelineScroll.scrollTop -= (ev2.clientY - lastY);
          }
          lastY = ev2.clientY;
          return;
        }
        ev2.preventDefault();
        updateFloatingDrag(ev2.clientX, ev2.clientY);
      };

      const onUp = function(ev2){
        clearTimeout(longPressTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);

        if(dragging){
          endFloatingDrag(ev2.clientX, ev2.clientY);
        } else if(!cancelledByScroll){
          openEdit(inst.masterId, inst.instanceDate);
        }
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  // 長按卡片右下角的圓點並拖曳：可以同時調整區塊的「長」（時長，下緣）與
  // 「寬」（參與者範圍，右緣）。起始時間與起始欄位（左上角）固定不動。
  function attachResizeHandle(card, inst, handle, runMin, runMax){
    let longPressTimer = null;
    let resizing = false;
    let startX = 0, startY = 0;
    let origHeight = 0, origTop = 0;
    let startScrollTop = 0;
    let pendingRunMax = runMax;

    handle.addEventListener('pointerdown', function(e){
      e.stopPropagation(); // 不要觸發卡片本體「移動時間」的那組互動
      startX = e.clientX;
      startY = e.clientY;
      origHeight = parseFloat(card.style.height) || 0;
      origTop = parseFloat(card.style.top) || 0;
      startScrollTop = timelineScroll.scrollTop;
      pendingRunMax = runMax;
      resizing = false;

      longPressTimer = setTimeout(function(){
        resizing = true;
        card.classList.add('resizing');
        handle.classList.add('active');
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        if(navigator.vibrate) navigator.vibrate(15);
      }, 400);

      const onMove = function(e2){
        if(!resizing){
          const dy = Math.abs(e2.clientY - startY);
          const realScrolled = Math.abs(timelineScroll.scrollTop - startScrollTop) > 2;
          if(realScrolled || dy > 16){
            clearTimeout(longPressTimer); // 視為捲動，取消縮放
          }
          return;
        }
        e2.preventDefault();

        // 上下拖曳：改變高度（時長），起始時間固定，只延伸/縮短下緣
        let newHeight = origHeight + (e2.clientY - startY);
        newHeight = Math.max(12.5, Math.min(newHeight, 1200 - origTop));
        newHeight = Math.round(newHeight/12.5)*12.5; // 吸附 15 分鐘
        card.style.height = newHeight+'px';

        // 左右拖曳：改變欄位範圍（右緣，起始欄不動）
        const rect = eventsLayer.getBoundingClientRect();
        const n = Math.max(1, columns.length);
        const colWidthPx = rect.width / n;
        const dCols = Math.round((e2.clientX - startX) / colWidthPx);
        pendingRunMax = Math.max(runMin, Math.min(n-1, runMax + dCols));
        const leftPct = (runMin/n*100);
        const widthPct = ((pendingRunMax-runMin+1)/n*100);
        card.style.left = 'calc(' + leftPct + '% + 3px)';
        card.style.width = 'calc(' + widthPct + '% - 6px)';
      };

      const onUp = function(e2){
        clearTimeout(longPressTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);

        if(resizing){
          card.classList.remove('resizing');
          handle.classList.remove('active');

          const finalHeight = parseFloat(card.style.height);
          let durationMin = Math.round(finalHeight/50*60/15)*15;
          durationMin = Math.max(15, durationMin);
          const startMinAbs = Math.round(origTop/50*60);
          const newStart = minutesToTime(startMinAbs);
          const newEnd = minutesToTime(startMinAbs + durationMin);

          // 把這個分段原本涵蓋的欄位，換成拖曳後的新範圍（runMin 不變）
          const origIds = columns.slice(runMin, runMax+1).map(c=>c.id);
          const newIds = columns.slice(runMin, pendingRunMax+1).map(c=>c.id);
          const pset = new Set(inst.participants||[]);
          origIds.forEach(id => { if(newIds.indexOf(id)===-1) pset.delete(id); });
          newIds.forEach(id => pset.add(id));

          quickSetTimeAndParticipants(inst.masterId, inst.instanceDate, newStart, newEnd, Array.from(pset));
          renderEvents();
        }
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  /* ---------------- 長按空白時段 → 拖曳選取範圍(可跨欄) → 放開建立新行程 ----------------
     單純點一下不會建立行程；需長按 400ms 進入選取模式（會有震動回饋與
     選取框），接著拖曳決定時段範圍（上下）與參與欄位範圍（左右），
     放開手指才真正建立新行程並跳轉到編輯頁。長按尚未觸發前若上下移動
     超過 8px，視為頁面捲動，直接取消，不建立任何東西。 */
  const timelineScroll = document.getElementById('timelineScroll');
  let selectionBox = null;

  function snap25(px){ return Math.round(px/12.5)*12.5; } // 12.5px = 15分鐘（50px/小時 ÷ 4）

  function ensureSelectionBox(){
    if(selectionBox) return selectionBox;
    selectionBox = document.createElement('div');
    selectionBox.className = 'selection-box';
    selectionBox.innerHTML = '<span class="selection-label"></span>';
    // 一定要掛在 eventsLayer 底下（不是 timelineGrid！），因為欄位的
    // 百分比寬度是以 eventsLayer 的寬度為基準（已經扣掉左側 58px 的
    // 時間刻度區）。掛錯父層會讓百分比基準多算那 58px，導致選取框
    // 整體往左偏移。
    eventsLayer.appendChild(selectionBox);
    return selectionBox;
  }
  function removeSelectionBox(){
    if(selectionBox){ selectionBox.remove(); selectionBox = null; }
  }
  function paintSelectionBox(topPx, bottomPx, colMin, colMax){
    const box = ensureSelectionBox();
    const n = columns.length;
    box.style.top = topPx+'px';
    box.style.height = Math.max(25, bottomPx-topPx)+'px';
    box.style.left = 'calc(' + (colMin/n*100) + '% + 2px)';
    box.style.width = 'calc(' + ((colMax-colMin+1)/n*100) + '% - 4px)';
    // 直接記錄實際欄位索引，放開時讀這裡即可，不要從 calc() 字串反推
    // （parseFloat 遇到 "calc(...)" 開頭的字串會直接回傳 NaN）
    box.dataset.colMin = colMin;
    box.dataset.colMax = colMax;
    const startMin = Math.round(topPx/50*60);
    const endMin = Math.round(bottomPx/50*60);
    const names = columns.slice(colMin, colMax+1).map(c=>c.name).join('、');
    box.querySelector('.selection-label').textContent =
      minutesToTime(startMin) + ' – ' + minutesToTime(endMin) + (names ? ' · '+names : '');
  }

  (function(){
    let downY = 0, downX = 0, lastY = 0, anchorPx = 0, anchorColIdx = 0;
    let longPressTimer = null;
    let selecting = false;
    let cancelled = false;
    let gestureMode = null; // 一旦離開長按判斷，決定是 'scroll'（捲動）還是 'swipeday'（左右滑動切日），決定後就不再切換

    function colIdxFromX(clientX){
      const rect = eventsLayer.getBoundingClientRect();
      const n = Math.max(1, columns.length);
      const ratio = (clientX - rect.left) / rect.width;
      return Math.max(0, Math.min(n-1, Math.floor(ratio * n)));
    }

    function onMove(e){
      const rect = eventsLayer.getBoundingClientRect();
      const curPx = e.clientY - rect.top;

      if(!selecting){
        // timeline-grid 是 touch-action:none，瀏覽器不會自動幫忙捲動，
        // 所以一旦判定使用者其實是想捲動或左右滑動切日（而不是要長按
        // 拉框），要自己接手處理，才會有正常的手勢手感。
        if(!cancelled){
          const dy = e.clientY - downY;
          const dx = e.clientX - downX;
          if(Math.abs(dy) > 8 || Math.abs(dx) > 15){
            cancelled = true;
            clearTimeout(longPressTimer);
            gestureMode = (Math.abs(dx) > Math.abs(dy)) ? 'swipeday' : 'scroll';
          }
        }
        if(gestureMode === 'scroll'){
          timelineScroll.scrollTop -= (e.clientY - lastY);
        } else if(gestureMode === 'swipeday'){
          e.preventDefault();
          updateDaySlide(e.clientX - downX); // 畫面即時跟著手指位移滑動，跟垂直捲動同樣的連貫手感
        }
        lastY = e.clientY;
        return;
      }
      e.preventDefault();
      let top = Math.min(anchorPx, curPx);
      let bottom = Math.max(anchorPx, curPx);
      top = Math.max(0, snap25(top));
      bottom = Math.min(1200, snap25(bottom));
      if(bottom - top < 12.5) bottom = top + 12.5;

      const curColIdx = colIdxFromX(e.clientX);
      const colMin = Math.min(anchorColIdx, curColIdx);
      const colMax = Math.max(anchorColIdx, curColIdx);
      paintSelectionBox(top, bottom, colMin, colMax);
    }

    function onUp(e){
      clearTimeout(longPressTimer);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);

      if(selecting){
        const box = selectionBox;
        const top = parseFloat(box.style.top);
        const height = parseFloat(box.style.height);
        const colMin = Number(box.dataset.colMin);
        const colMax = Number(box.dataset.colMax);
        removeSelectionBox();
        const startMin = Math.round(top/50*60);
        const endMin = Math.round((top+height)/50*60);
        const participantIds = columns.slice(colMin, colMax+1).map(c=>c.id);
        createNewEvent(startMin, endMin, participantIds);
      } else if(gestureMode === 'swipeday'){
        // 放開手指：滑動幅度夠大就用動畫接續完成切日，不夠就彈回原位
        endDaySlide(e.clientX - downX);
      }
      selecting = false;
      cancelled = false;
      gestureMode = null;
    }

    timelineGrid.addEventListener('pointerdown', function(e){
      // 只處理空白區域（行程卡自己的 pointerdown 會 stopPropagation）
      downY = e.clientY;
      downX = e.clientX;
      lastY = e.clientY;
      cancelled = false;
      selecting = false;
      gestureMode = null;
      const rect = eventsLayer.getBoundingClientRect();
      anchorPx = e.clientY - rect.top;
      anchorColIdx = colIdxFromX(e.clientX);

      longPressTimer = setTimeout(function(){
        if(cancelled) return;
        selecting = true;
        if(navigator.vibrate) navigator.vibrate(15);
        let top = Math.max(0, snap25(anchorPx));
        let bottom = Math.min(1200, top + 50); // 預設長按不拖曳＝1小時
        paintSelectionBox(top, bottom, anchorColIdx, anchorColIdx);
      }, 400);

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  })();

  function createNewEvent(startMin, endMin, participantIds){
    startMin = Math.max(0, Math.min(23*60+45, startMin));
    endMin = Math.max(startMin+15, Math.min(24*60, endMin));
    if(!participantIds || participantIds.length===0) participantIds = [columns[0].id];
    const id = 'e' + Date.now();
    const ev = {
      id: id,
      title: '新行程',
      date: currentDate,
      start: minutesToTime(startMin),
      end: minutesToTime(endMin),
      notes: '',
      participants: participantIds.slice(),
      recurrence: null
    };
    events.push(ev);
    renderEvents();
    openEdit(id, currentDate);
  }

  document.getElementById('fabAdd').addEventListener('click', function(){
    const now = new Date();
    const startHour = currentDate === todayStr() ? now.getHours() : 9;
    createNewEvent(startHour*60, startHour*60 + 60, [columns[0].id]);
  });

  document.getElementById('btnAddColumn').addEventListener('click', function(){
    const name = (window.prompt('新增共編使用者的名字：', '') || '').trim();
    if(!name) return;
    const id = 'p' + Date.now();
    columns.push({id, name});
    renderColumnHeader();
    renderEvents(); // 欄位數變了，行程的寬度/位置要重新計算
  });

  /* ---------------- 日期切換 ---------------- */
  function shiftDate(delta){
    const [y,m,d] = currentDate.split('-').map(Number);
    const dt = new Date(y, m-1, d + delta);
    currentDate = dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
    renderTimeline();
  }
  document.getElementById('prevDay').addEventListener('click', ()=>shiftDate(-1));
  document.getElementById('nextDay').addEventListener('click', ()=>shiftDate(1));

  /* ---------------- 編輯頁：欄位與三欄時間連動 ---------------- */
  const pageTimeline = document.getElementById('page-timeline');
  const pageEdit = document.getElementById('page-edit');
  const fieldTitle = document.getElementById('fieldTitle');
  const fieldDate = document.getElementById('fieldDate');
  const fieldStart = document.getElementById('fieldStart');
  const fieldEnd = document.getElementById('fieldEnd');
  const fieldDuration = document.getElementById('fieldDuration');
  const fieldNotes = document.getElementById('fieldNotes');
  const participantsBox = document.getElementById('participantsBox');
  const weekdayBox = document.getElementById('weekdayBox');
  const syncField = document.getElementById('syncField');
  const fieldSyncEdit = document.getElementById('fieldSyncEdit');
  let selectedParticipants = new Set();
  let selectedWeekdays = new Set();

  function renderParticipantChips(selectedIds){
    selectedParticipants = new Set(selectedIds);
    participantsBox.innerHTML = '';
    columns.forEach(col => {
      const chip = document.createElement('div');
      chip.className = 'participant-chip' + (selectedParticipants.has(col.id) ? ' selected' : '');
      chip.dataset.id = col.id;
      chip.innerHTML = '<span class="chip-dot"></span><span></span>';
      chip.querySelector('span:last-child').textContent = col.name;
      chip.addEventListener('click', function(){
        if(selectedParticipants.has(col.id)){
          // 至少保留一位參與者，避免行程變成沒人參加
          if(selectedParticipants.size > 1) selectedParticipants.delete(col.id);
        } else {
          selectedParticipants.add(col.id);
        }
        chip.classList.toggle('selected', selectedParticipants.has(col.id));
      });
      participantsBox.appendChild(chip);
    });
  }

  function renderWeekdayChips(weekdays){
    selectedWeekdays = new Set(weekdays||[]);
    weekdayBox.innerHTML = '';
    WEEKDAYS.forEach((label, idx) => {
      const chip = document.createElement('div');
      chip.className = 'weekday-chip' + (selectedWeekdays.has(idx) ? ' selected' : '');
      chip.textContent = label.slice(1); // 週日→日、週一→一...
      chip.addEventListener('click', function(){
        if(selectedWeekdays.has(idx)) selectedWeekdays.delete(idx);
        else selectedWeekdays.add(idx);
        chip.classList.toggle('selected', selectedWeekdays.has(idx));
      });
      weekdayBox.appendChild(chip);
    });
  }

  function fillEditForm(data, dateStr, isRecurring){
    fieldTitle.value = data.title || '';
    fieldDate.value = dateStr;
    fieldDate.disabled = !!isRecurring; // 重複行程的個別日期由「重複」規則決定，這裡不能單獨改
    fieldStart.value = data.start;
    fieldEnd.value = data.end;
    fieldDuration.value = timeToMinutes(data.end) - timeToMinutes(data.start);
    fieldNotes.value = data.notes || '';
    renderParticipantChips(data.participants && data.participants.length ? data.participants : [columns[0].id]);
  }

  fieldStart.addEventListener('input', function(){
    if(!fieldStart.value) return;
    if(fieldDuration.value){
      fieldEnd.value = minutesToTime(timeToMinutes(fieldStart.value) + Number(fieldDuration.value));
    } else if(fieldEnd.value){
      fieldDuration.value = Math.max(5, timeToMinutes(fieldEnd.value) - timeToMinutes(fieldStart.value));
    }
  });

  fieldEnd.addEventListener('input', function(){
    if(!fieldEnd.value) return;
    if(fieldStart.value){
      fieldDuration.value = Math.max(5, timeToMinutes(fieldEnd.value) - timeToMinutes(fieldStart.value));
    }
  });

  fieldDuration.addEventListener('input', function(){
    if(fieldDuration.value && fieldStart.value){
      fieldEnd.value = minutesToTime(timeToMinutes(fieldStart.value) + Number(fieldDuration.value));
    }
  });

  /* ---------------- 開啟／關閉編輯頁（SPA + History API） ----------------
     注意：某些內嵌預覽環境（例如聊天工具的沙盒 iframe）會擋掉
     history.pushState/back，呼叫時會直接丟出例外。若不處理，例外會中斷
     整段初始化流程，導致時間網格畫不出來、點擊也沒有反應。
     這裡一律用 try/catch 包住，失敗時改用純 JS 的頁面切換當備援，
     真正部署到瀏覽器分頁時則會自動使用真正的 History API（返回鍵可用）。 */
  let usingRealHistory = true;
  let editingMasterId = null;
  let editingInstanceDate = null;

  function openEdit(masterId, instanceDate){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    editingMasterId = masterId;
    editingInstanceDate = instanceDate;

    // 取得這一天實際顯示的內容（已套用 override 的版本）
    const inst = getInstancesForDate(instanceDate).find(
      i => i.masterId === masterId && i.instanceDate === instanceDate
    );
    const data = inst || {
      title: master.title, start: master.start, end: master.end,
      notes: master.notes, participants: master.participants
    };

    fillEditForm(data, instanceDate, !!master.recurrence);
    renderWeekdayChips(master.recurrence ? master.recurrence.weekdays : []);
    syncField.style.display = master.recurrence ? 'flex' : 'none';
    fieldSyncEdit.checked = false;

    if(usingRealHistory){
      try{
        history.pushState({page:'edit'}, '', '#edit');
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('edit');
  }

  function showPage(name){
    if(name === 'edit'){
      pageEdit.classList.add('active');
      pageTimeline.classList.add('pushed');
    } else {
      pageEdit.classList.remove('active');
      pageTimeline.classList.remove('pushed');
      editingMasterId = null;
      editingInstanceDate = null;
    }
  }

  function goBackToTimeline(){
    if(usingRealHistory){
      try{
        history.back(); // 觸發 popstate -> showPage('timeline')
        return;
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('timeline'); // 備援：直接切換，不依賴 History API
  }

  window.addEventListener('popstate', function(e){
    // 手機返回鍵 / 側滑手勢：只退回時間軸主頁，不離開網頁
    showPage('timeline');
  });

  document.getElementById('btnCancel').addEventListener('click', function(){
    goBackToTimeline(); // 不儲存任何變更
  });

  document.getElementById('btnDone').addEventListener('click', function(){
    if(!editingMasterId) return;
    const master = events.find(e => e.id === editingMasterId);
    if(!master) return;

    const newTitle = fieldTitle.value.trim() || '新行程';
    const newNotes = fieldNotes.value;
    const newParticipants = selectedParticipants.size ? Array.from(selectedParticipants) : [columns[0].id];

    let s = fieldStart.value || master.start;
    let en = fieldEnd.value;
    let dur = fieldDuration.value;
    if(en && timeToMinutes(en) <= timeToMinutes(s) && dur){
      en = minutesToTime(timeToMinutes(s) + Number(dur));
    }
    const newStart = s;
    const newEnd = en || minutesToTime(timeToMinutes(s) + Number(dur||60));

    const newWeekdays = Array.from(selectedWeekdays).sort((a,b)=>a-b);
    const wasRecurring = !!master.recurrence;
    const syncOn = fieldSyncEdit.checked;

    // 「重複」規則永遠套用到整個系列，跟同步編輯開關無關（單一日期沒有自己的重複規則）
    master.recurrence = newWeekdays.length ? {weekdays:newWeekdays} : null;

    if(!wasRecurring && !master.recurrence){
      // 原本就是單一行程，也沒有設定重複：直接改本體（含日期）
      master.title = newTitle;
      master.date = fieldDate.value || master.date;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
    } else if(!wasRecurring && master.recurrence){
      // 這次才剛把單一行程加上重複規則：本體變成系列的 master，
      // date 欄位保持原本的起始日（重複行程時日期欄位是鎖住的，不會被改到）
      master.title = newTitle;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
    } else if(syncOn){
      // 同步編輯：套用到整個系列
      master.title = newTitle;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
      // 這一天如果原本有獨立編輯過的內容，順便清掉，讓它跟系列同步一致
      if(master.overrides) delete master.overrides[editingInstanceDate];
    } else {
      // 沒開同步編輯：只改這一天，寫入 override，系列其他日期不受影響
      master.overrides = master.overrides || {};
      master.overrides[editingInstanceDate] = {
        title:newTitle, start:newStart, end:newEnd, notes:newNotes, participants:newParticipants
      };
    }

    currentDate = master.recurrence ? editingInstanceDate : master.date;
    renderTimeline();
    goBackToTimeline();
  });

  document.getElementById('btnDelete').addEventListener('click', function(){
    if(!editingMasterId) return;
    const master = events.find(e => e.id === editingMasterId);
    if(!master) return;
    const syncOn = fieldSyncEdit.checked;

    if(!master.recurrence){
      events = events.filter(e => e !== master);
    } else if(syncOn){
      events = events.filter(e => e !== master); // 整個系列都刪除
    } else {
      // 只刪除這一天：加入排除清單，其餘日期的系列不受影響
      master.excluded = master.excluded || [];
      if(master.excluded.indexOf(editingInstanceDate) === -1) master.excluded.push(editingInstanceDate);
      if(master.overrides) delete master.overrides[editingInstanceDate];
    }

    renderTimeline();
    goBackToTimeline();
  });

  /* ---------------- 初始化 ---------------- */
  try{
    history.replaceState({page:'timeline'}, '', '#timeline');
  }catch(err){
    usingRealHistory = false;
  }
  buildHourRows();
  renderTimeline();
  // 開場自動捲到 08:00 附近
  timelineScroll.scrollTop = 7*50;

  // 每分鐘更新一次「現在時間」紅線
  setInterval(renderNowLine, 60*1000);

})();
</script>
</body>
